name: Refresh wiper price/stock from Cyberbiz

on:
  schedule:
    - cron: '0 22 * * *'   # 06:00 Taiwan (UTC+8)
    - cron: '0 4 * * *'    # 12:00 Taiwan
  workflow_dispatch: {}     # manual "Run workflow" button for ad-hoc daytime stock updates

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Re-fetch products + rebuild data.json
        run: |
          cd tools
          # carmall.com.tw goes unreachable from GitHub's runners for a few minutes every
          # few weeks (2026-08-10 and 2026-08-31: TCP connect timeouts on the very first
          # sitemap fetch, while the site answered in <0.5s from Taiwan throughout, and a
          # manual re-run 30 minutes later found the price/stock unchanged). fetch_products.py's
          # own retries only span ~3 minutes, which was not enough either time.
          # Widening those is the wrong lever: get() also retries HTTPError, so a longer
          # schedule would make every stale-handle 404 crawl. Give the whole fetch one more
          # shot after the blip has had time to pass instead. A real outage still fails the
          # job, which is the signal that actually reaches Jerry.
          python fetch_products.py || {
            echo "::warning::抓不到 carmall.com.tw，10 分鐘後重試一次"
            rm -f .fetch_incomplete
            sleep 600
            python fetch_products.py
          }
          python build_data.py
      - name: Commit & push if changed
        run: |
          git config user.name "carmall-wiper-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data.json tools/wiper_products.json tools/promos.json
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "chore: refresh price/stock from Cyberbiz [skip ci]"
          # Race-safe push: a concurrent/scheduled run (or any push to main) can
          # advance the remote between checkout and push, which rejects a plain
          # `git push` (non-fast-forward). Rebase our regenerated data onto the
          # latest main and retry. If our data is identical to what landed first,
          # the rebased commit becomes empty and the push is a no-op.
          n=0
          until git push; do
            n=$((n + 1))
            if [ "$n" -ge 5 ]; then
              echo "::error::push still rejected after $n attempts"
              exit 1
            fi
            echo "Push rejected (attempt $n); rebasing onto latest origin/main..."
            git pull --rebase -X theirs origin main
          done

      # fetch_products.py leaves this marker when a product listed in a wiper collection
      # was never fetched (sitemap lag beyond the collection endpoint's 24-item window).
      # The refreshed prices above are still worth publishing, so the run is failed here
      # instead of earlier: data ships, and the red job is what actually gets noticed.
      - name: Fail if the product catalog was incomplete
        if: always()
        run: |
          if [ -f tools/.fetch_incomplete ]; then
            echo "::error::這些商品在集合裡但沒抓到，查詢器會少東西："
            cat tools/.fetch_incomplete
            exit 1
          fi
